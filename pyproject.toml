[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-route"
version = "0.1.0"
description = "Run KRT or Freerouting on an isolated copy of a KiCad project and grade the candidate with KiCad's own DRC"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest", "jsonschema>=4.18"]   # jsonschema: tests/test_interface_contract.py only

[project.scripts]
kicad-route = "kicad_route.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kicad_route.router" = ["LICENSE", "VERSION", "UPSTREAM.json", "requirements.txt",
    "rust_router/Cargo.toml", "rust_router/Cargo.lock", "rust_router/src/*.rs",
    ".claude/skills/*/SKILL.md", "py_router/stage3d/*.json", "py_router/stage3d/*.mjs",
    "py_router/stage3d/page/*", "py_router/stage3d/vendor/three/LICENSE",
    "py_router/stage3d/vendor/three/VERSION.txt", "py_router/stage3d/vendor/three/build/*.js",
    "py_router/stage3d/vendor/three/examples/jsm/*/*.js"]
